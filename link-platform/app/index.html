<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f9" />
  <title>安药 · 用药提醒</title>
  <script>if(window.NativeApi)document.documentElement.classList.add('android-app');</script>
  <script>/* 首屏之前解析字号设置，避免闪烁；主题跟随系统。 */try{var anyaoAppearance=JSON.parse(localStorage.getItem('anyao-appearance')||'{}');document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';if(anyaoAppearance.fontScale==='large')document.documentElement.dataset.fontScale='large'}catch(e){}</script>
  <link rel="stylesheet" href="./assets.css" />
  <link rel="stylesheet" href="./fonts.css" />
  <link rel="stylesheet" href="./mira.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body data-role="user">
  <main class="app-shell">
    <section class="phone" aria-label="安药用药提醒应用">
      <section id="view" class="view" aria-live="polite"></section>
      <nav class="tabbar" aria-label="主导航">
        <button type="button" data-tab="today" data-icon="health"><span class="tab-icon" data-mi="health"></span>今天</button>
        <button type="button" data-tab="meds" data-icon="sport"><span class="tab-icon" data-mi="sport"></span>用药</button>
        <button type="button" data-tab="box" data-icon="device"><span class="tab-icon" data-mi="device"></span>药盒</button>
        <button type="button" data-tab="settings" data-icon="mine"><span class="tab-icon" data-mi="mine"></span>设置</button>
      </nav>
    </section>
  </main>

  <dialog id="detail-dialog" class="m-sheet" aria-label="详情"></dialog>
  <dialog id="confirm-dialog" class="m-dialog" aria-label="确认">
    <form id="confirm-form" method="dialog">
      <div class="dialog-head"><h2 id="confirm-dialog-title">确认</h2></div>
      <p class="helper" id="confirm-dialog-note"></p>
      <div class="dialog-actions"><button type="button" class="m-btn m-btn-secondary" data-dialog-cancel>取消</button><button type="submit" id="confirm-dialog-ok" class="m-btn m-btn-danger">确定</button></div>
    </form>
  </dialog>
  <dialog id="pillbox-dialog" class="m-dialog" aria-label="连接智能药盒">
    <div class="dialog-head"><h2>连接智能药盒</h2></div>
    <div id="pillbox-connect-body"></div>
    <div class="dialog-actions"><button type="button" class="m-btn m-btn-secondary" data-dialog-cancel>关闭</button></div>
  </dialog>

  <script src="./native-client.js"></script>
  <script src="./reminder-model.js"></script>
  <script src="./pillbox-model.js"></script>
  <script src="./hipee-protocol.js"></script>
  <script src="./app-core.js"></script>
  <script src="./reminder-engine.js"></script>
  <script src="./ui.js"></script>
  <script src="./reminder-ui.js"></script>
  <script src="./device-bridge.js"></script>
  <script src="./pillbox-ui.js"></script>
  <script src="./watch-ui.js"></script>
  <script src="./pillbox-records-ui.js"></script>
</body>
</html>
